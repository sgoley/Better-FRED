name: Better-FRED
options:
  bundleIdPrefix: com.betterfred
  deploymentTarget:
    iOS: "17.0"
targets:
  Better-FRED:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - Better-FREDWidget/**
          - "*.xcodeproj/**"
          - ".build/**"
          - "DerivedData/**"
          - "docs/**"
          - LICENSE
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.betterfred.app
      SWIFT_VERSION: 5.9
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: BetterEcon
        CFBundleName: Better US Econ Data
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  Better-FREDWidget:
    type: app-extension
    platform: iOS
    sources: [Better-FREDWidget]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.betterfred.app.widget
      SWIFT_VERSION: 5.9
    info:
      path: Better-FREDWidget/Info.plist
      properties:
        CFBundleDisplayName: BetterEcon Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BetterFREDWidgetBundle
