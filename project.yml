name: BetterEcon
options:
  bundleIdPrefix: com.betterecon
  deploymentTarget:
    iOS: "17.0"
targets:
  BetterEcon:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - BetterEconWidget/**
          - "*.xcodeproj/**"
          - ".build/**"
          - "DerivedData/**"
          - "docs/**"
          - LICENSE
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.betterecon.app
      SWIFT_VERSION: 5.9
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: BetterEcon
        CFBundleName: Better US Econ Data
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  BetterEconWidget:
    type: app-extension
    platform: iOS
    sources: [BetterEconWidget]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.betterecon.app.widget
      SWIFT_VERSION: 5.9
    info:
      path: BetterEconWidget/Info.plist
      properties:
        CFBundleDisplayName: BetterEcon Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BetterEconWidgetBundle
